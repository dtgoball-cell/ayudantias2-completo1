name: ayudantia2
services:
  app:
    build: ./app
    ports:
      - "8080:3000"
    enviorenment:
      DB_HOST: db
      DB_USER: app
      DB_PASSWORD: app123
      DB_NAME: empresa_cloud
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD_SHELL", "wget -q --spider http://127.0.0.1:3000 && wget -qO-
      http://127.0.0.1:3000 | grep -q . || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontal
      - interna

  db: 
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD:
      MARIADB_DATABASE: empresa_cloud
      MARIADB_USER: app
      MARIA_PASSWORD: app123
   volumes:
     - datos-db:/var/lib/mysql
     - ./database/init.sql:docker-entrypoint-initdb.d/init.sql:ro
   healthcheck:
     test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
     interval: 5s
     timeout: 3s
     retries: 10
     start_period: 20s
  networks:
    - interna

volumes:
  datos-db:

networks:
  frontal:
  interna:
    

